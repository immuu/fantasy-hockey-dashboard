<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Fantasy Hockey Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    .meta-info {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background-color: var(--card);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.85rem;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .badge {
      background-color: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="league-title">ESPN Fantasy Hockey</h1>
        <div class="meta-info" id="update-time">Päivitetään...</div>
      </div>
      <div id="week-badge" class="badge">Viikko -</div>
    </header>

    <div class="grid">
      <!-- Sarjataulukko -->
      <div class="card">
        <div class="card-title">🏆 Sarjataulukko & Pisteet</div>
        <table id="standings-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Joukkue</th>
              <th>Pisteet (PF)</th>
              <th>V-H-T</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4">Ladataan tietoja...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Vertailukaavio -->
      <div class="card">
        <div class="card-title">📊 Joukkueiden Piste-erot</div>
        <canvas id="pointsChart" height="220"></canvas>
      </div>
    </div>

    <!-- Vapaat agentit -->
    <div class="card">
      <div class="card-title">🔥 Kuumimmat Vapaat Agentit (Free Agents)</div>
      <table id="fa-table">
        <thead>
          <tr>
            <th>Pelaaja</th>
            <th>Pelipaikka</th>
            <th>Joukkue</th>
            <th>Pisteet yhteensä</th>
            <th>Pistekeskiarvo (P/G)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5">Ladataan tietoja...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        // Estetään selaimen välimuisti lisäämällä aikaleima URL-osoitteeseen
        const cacheBuster = new Date().getTime();
        const response = await fetch(`data.json?t=${cacheBuster}`);
        
        if (!response.ok) {
          throw new Error("data.json-tiedostoa ei pystytty lataamaan.");
        }

        const data = await response.json();
        renderDashboard(data);
      } catch (error) {
        console.error("Virhe ladattaessa dataa:", error);
        document.getElementById("update-time").innerText = "Virhe ladattaessa tiedostoa data.json";
      }
    }

    function renderDashboard(data) {
      // 1. Otsikko & Meta-tiedot
      document.getElementById("league-title").innerText = data.league_name || "ESPN Fantasy Hockey";
      document.getElementById("week-badge").innerText = `Viikko ${data.current_week || 1}`;
      document.getElementById("update-time").innerText = `Päivitetty: ${new Date().toLocaleString('fi-FI')}`;

      // 2. Sarjataulukko
      const teams = data.teams || [];
      // Järjestetään pisteiden mukaan laskevasti
      teams.sort((a, b) => b.points_for - a.points_for);

      const standingsBody = document.querySelector("#standings-table tbody");
      standingsBody.innerHTML = "";

      teams.forEach((team, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td>${team.name} (${team.abbrev})</td>
          <td><strong>${team.points_for}</strong></td>
          <td>${team.wins}-${team.losses}-${team.ties}</td>
        `;
        standingsBody.appendChild(row);
      });

      // 3. Kaavio
      renderChart(teams);

      // 4. Vapaat agentit
      const faBody = document.querySelector("#fa-table tbody");
      faBody.innerHTML = "";

      const freeAgents = data.free_agents || [];
      freeAgents.forEach(player => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${player.name}</strong></td>
          <td><span class="badge">${player.position}</span></td>
          <td>${player.proTeam}</td>
          <td>${player.total_points}</td>
          <td>${player.avg_points}</td>
        `;
        faBody.appendChild(row);
      });
    }

    function renderChart(teams) {
      const ctx = document.getElementById("pointsChart").getContext("2d");
      
      const labels = teams.map(t => t.abbrev || t.name);
      const points = teams.map(t => t.points_for);

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Pisteet (PF)',
            data: points,
            backgroundColor: '#38bdf8',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    // Käynnistetään lataus
    loadDashboardData();
  </script>
</body>
</html>
