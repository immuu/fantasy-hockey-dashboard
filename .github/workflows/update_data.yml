name: Update ESPN Fantasy Data

on:
  schedule:
    # Aja automaattisesti joka yö klo 06:00 UTC (n. klo 09:00 Suomen aikaa)
    - cron: '0 6 * * *'
  # Mahdollistaa skriptin ajamisen käsin GitHubin käyttöliittymästä
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Tarvitaan, jotta automaatio voi tallentaa data.json:in repositoryyn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install espn-api

      - name: Run data fetch script
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python fetch_data.py

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
